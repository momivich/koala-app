  <ellipse cx="380" cy="248" rx="28" ry="14" fill="#4aaa4a" transform="rotate(-40 380 248)"/>
  <ellipse cx="408" cy="210" rx="28" ry="14" fill="#3a9a3a" transform="rotate(-50 408 210)"/>
