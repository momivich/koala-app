  <ellipse cx="148" cy="165" rx="40" ry="38" fill="#c4a882"/>
  <!-- 耳（右） -->
  <ellipse cx="364" cy="165" rx="62" ry="58" fill="#8b7355"/>
  <ellipse cx="364" cy="165" rx="40" ry="38" fill="#c4a882"/>
